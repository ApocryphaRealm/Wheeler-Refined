[Debug]
; Category-based debug logging system (existing behavior).
Enabled = false
GlobalLevel = true

; When true, wheeler.log uses a strict allowlist and only keeps core startup lines.
; Set to false to restore normal logging output.
WhitelistOnlyCoreStartupLogs = false


[SettingsPage]
; Opens the Wheeler settings page at data load.
;
; The page is fully interactive: [Control.Wheel] SettingsPageKey (default 87 = F11) opens and closes
; it, the mouse and keyboard reach its widgets, and every keymap row can be rebound in place. This
; key is only a convenience for having it already open when the game finishes loading.
ShowOnLoad = false
