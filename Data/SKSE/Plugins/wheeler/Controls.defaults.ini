[Control.Wheel]
CursorRadiusPerEntry = 15.000000
ToggleHoldThreshold = 0.200000
BlockGameInputInEditMode = true
BlockExternalKeyMKB = 0
BlockExternalKeyGamepad = 0
EnableOpenInFavoritesMenu = true
EnableEditModeInFavoritesMenu = true
HideGameUIInEditMode = true

; Opens and closes the settings page. DIK scan code; 0 = unbound.
; 0x44 = 68 = F10. F11 is the Apocrypha Menu Framework's menu key, Wheeler binds no other F-key and
; F12 is Steam's screenshot key. A key the menu framework reserves is refused; set 0 to unbind.
SettingsPageKey = 68
; The same page on a controller. Wheeler gamepad code (266 + button index, e.g. 271 = Back); 0 = unbound.
; Ships unbound because every controller button already means something in vanilla gameplay; the page is
; also reachable from the menu framework's Mod Control Panel with a controller. Rebind it on the page.
SettingsPageGamepadButton = 0

; Turn the game's own Favorites menu off completely.
;
; NOT the same as EnableOpenInFavoritesMenu above - that one decides whether Wheeler may open while
; the Favorites menu is showing. This one stops that menu opening at all, by consuming its user
; event before the game receives it, whether or not a wheel is open.
;
; Off by default: removing a vanilla menu from someone who did not ask for it would be rude.
DisableVanillaFavoritesMenu = false
ToggleKeyPassThrough = true

; When the gamepad toggle is a D-pad direction with no modifier: HOLD it (longer than
; ToggleHoldThreshold) to open the wheel, TAP it to use the D-pad as the game or the open menu
; normally would. Other buttons keep press-to-toggle. Overrides ToggleKeyPassThrough for D-pad.
DpadHoldToToggle = true


