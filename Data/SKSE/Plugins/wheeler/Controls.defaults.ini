[Control.Wheel]
CursorRadiusPerEntry = 15.000000
ToggleHoldThreshold = 0.200000
BlockGameInputInEditMode = true
BlockExternalKeyMKB = 0
BlockExternalKeyGamepad = 0
HideGameUIInEditMode = true

; Turn the game's own Favorites menu off completely.
;
; It stops that menu opening at all, by consuming its user event before the game receives it,
; whether or not a wheel is open, so Wheeler takes its place.
;
; On by default since 1.2.6 (the owner, 2026-09-16: "wheeler should have a toggle to turn off favorites menu" - the toggle
; existed but shipped off, and with the vanilla menu still bound the game refused to give D-pad up to Toggle POV).
; Wheeler takes the place of that menu, so leaving it reachable served nobody.
DisableVanillaFavoritesMenu = true
; 1.3.0: the Perfected Wheeler Favorites System master toggle - off, the mod behaves as 1.2.9 did.
FavoritesSystem = true
; 1.3.1: the left stick is a wheel control while the wheel is open (its directions are buttons 282-285); the character stops moving.
LeftStickWheelControl = true
; 1.3.1: stop time completely while the wheel is open, whatever SlowTimeScale says. ON since 1.3.5.
StopTimeWhileOpen = true
; 1.3.6: settle a turned wheel on the nearest slot boundary when it is let go of.
SnapRotationToSlot = true
; Advanced settings: on shows every section of the settings page; off keeps only the first three
; (Wheeler Controls, Wheel Behavior, Ammo Wheel) and hides the rest. On by default.
ShowAdvancedSettings = true
ToggleKeyPassThrough = true

; When the gamepad toggle is a D-pad direction with no modifier: HOLD it (longer than
; ToggleHoldThreshold) to open the wheel, TAP it to use the D-pad as the game or the open menu
; normally would. Other buttons keep press-to-toggle. Overrides ToggleKeyPassThrough for D-pad.
DpadHoldToToggle = true


