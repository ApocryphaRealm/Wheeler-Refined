; ------------------------------------------------------------------------------------------
; Sections below added 2026-09-12 (ApocryphaRealm fork).
;
; These 56 keys are read by Config.cpp and exposed by the dMenu descriptor, but were absent
; from this file. Because the user Styles.ini is seeded FROM this file, they were absent there
; too, so the compiled defaults in src/bin/Config.h stayed in force and no settings menu could
; ever show or change them.
;
; Every value below is that compiled default, taken from the matching namespace in Config.h by
; qualified path (Styling::Item::Slot::Texture::Scale -> [Styling.Item.Slot.Texture] Scale).
; Runtime behaviour is therefore UNCHANGED - what changes is that the keys now exist, so they
; seed into user INIs and a settings page can read real values instead of guessing.
;
; Colours are packed ABGR as decimal (0xAABBGGRR), matching Config.cpp's unpackColor
; (r = packed & 0xFF ... a = packed >> 24) and ImGui's IM_COL32 with IMGUI_USE_BGRA_PACKED_COLOR
; undefined. NOTE: the "0xAARRGGBB" comment on GetHexColor in Config.cpp is stale.
; e.g. HoveredColorBegin 1073741823 = C_QUARTERTRANSPARENT = white at alpha 63.
;
; Values are deliberately written WITHOUT trailing inline comments - it is not established that
; CSimpleIni strips them from a value, and a mis-parsed colour would be worse than no comment.
; ------------------------------------------------------------------------------------------


